[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vcb-alt"
version = "0.1.0"
description = "Local-first personal US stock screening decision-support CLI."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "VCB-Alt" }]
dependencies = [
    "psycopg[binary]>=3.2,<4",
]

[project.scripts]
vcb-alt = "vcb_alt.cli:main"

[tool.setuptools]
packages = ["vcb_alt"]

# web.py serves these files at runtime and only falls back to its embedded copies when
# they are missing, so an installed package without them would quietly ship a stale UI.
[tool.setuptools.package-data]
vcb_alt = ["web_assets/*"]
